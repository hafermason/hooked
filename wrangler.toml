# Cloudflare Worker (free plan) serving the game at https://hooked.hafermason.workers.dev
# Deploy: npm run deploy   (builds dist/ then uploads the Worker)
name = "hooked"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/dist/*.html", "**/dist/*.css", "**/dist/*.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false
