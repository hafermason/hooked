<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B0A73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hooked! · Ice Fishing Frenzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="wrap">
<div id="stage">

  <!-- ========== 1 · TITLE ========== -->
  <section id="title" class="screen on" aria-label="Title">
    <div class="abs" style="left:0;top:0;width:390px;height:336px;background:linear-gradient(180deg,#FF4FA3 0%,#FF8A6B 45%,#FFD36E 100%)"></div>
    <div class="abs" style="left:236px;top:150px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#FFF6B0 0%,#FFE14D 55%,rgba(255,225,77,0) 72%)"></div>
    <div class="abs" style="left:-20px;top:252px;width:150px;height:60px;border-radius:40px;background:#fff;opacity:.85"></div>
    <div class="abs" style="left:300px;top:270px;width:120px;height:44px;border-radius:30px;background:#fff;opacity:.75"></div>

    <div class="abs center" style="top:44px;animation:bob 2.4s ease-in-out infinite">
      <h1 class="ol logo"><span style="color:#FF2E93">H</span><span style="color:#00E5FF">O</span><span style="color:#B6FF2E">O</span><span style="color:#FF7A1A">K</span><span style="color:#FFE14D">E</span><span style="color:#B98CFF">D</span><span style="color:#FF2E93">!</span></h1>
    </div>
    <div class="abs center" style="top:146px"><div class="tagline">ICE FISHING FRENZY</div></div>

    <div class="abs" style="left:14px;top:196px;width:132px;animation:float 2.8s ease-in-out infinite">
      <div class="daily">
        <div class="daily-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>DAILY</div>
        <div id="dailyTitle" class="lil" style="font-size:18px;line-height:1.05">Catch 3 shiny fish</div>
        <div id="dailyReward" style="font-weight:700;font-size:13px;color:#B3006A">x2 score</div>
        <div style="font-weight:600;font-size:11px">ends in <span id="dailyEnds">—</span></div>
      </div>
    </div>

    <div id="t-otter" class="abs" style="left:140px;top:182px;width:150px;height:150px;animation:float 3s ease-in-out infinite"></div>
    <div class="abs" style="left:295px;top:228px;width:3px;height:236px;background:#fff;opacity:.9"></div>
    <svg viewBox="0 0 40 60" width="32" height="48" class="abs" style="left:282px;top:458px;transform-origin:14px 0;animation:wiggle 1.6s ease-in-out infinite;overflow:visible" aria-hidden="true">
      <path d="M14 0 L14 34 Q14 50 26 50 Q36 50 36 38" fill="none" stroke="#1A0B3D" stroke-width="9" stroke-linecap="round"/>
      <path d="M14 0 L14 34 Q14 50 26 50 Q36 50 36 38" fill="none" stroke="#E6ECFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M6 22 Q18 14 12 32 Q6 46 20 40" fill="none" stroke="#1A0B3D" stroke-width="10" stroke-linecap="round"/>
      <path d="M6 22 Q18 14 12 32 Q6 46 20 40" fill="none" stroke="#FF6FB5" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <div class="abs" style="left:0;top:322px;width:390px;height:30px;background:linear-gradient(180deg,#fff 0%,#BDF4FF 100%);border-top:5px solid #1A0B3D;border-bottom:5px solid #1A0B3D"></div>
    <div class="abs" style="left:266px;top:325px;width:60px;height:18px;border-radius:50%;background:#0B7FA6;border:4px solid #1A0B3D;box-sizing:border-box"></div>
    <svg viewBox="0 0 390 20" width="390" height="20" class="abs" style="left:0;top:361px" aria-hidden="true"><path d="M0 0 L20 0 L28 14 L36 0 L90 0 L96 10 L102 0 L170 0 L180 16 L190 0 L340 0 L348 12 L356 0 L390 0" fill="#BDF4FF" stroke="#1A0B3D" stroke-width="4" stroke-linejoin="round"/></svg>

    <div class="ray" style="left:40px;top:360px;width:60px;height:480px;animation-duration:4s"></div>
    <div class="ray" style="left:170px;top:360px;width:34px;height:420px;animation-duration:3.2s;animation-delay:.8s"></div>
    <div class="ray" style="left:330px;top:360px;width:48px;height:460px;animation-duration:5s;animation-delay:1.4s"></div>

    <div id="t-weedBack" class="layer"></div>
    <div id="t-fish" class="layer"></div>
    <div id="t-bubbles" class="layer"></div>

    <div class="abs center" style="top:396px">
      <div class="pill" style="padding:6px 18px 6px 10px">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 10 L10 16 L16 6 L22 16 L28 10 L25 24 L7 24 Z" fill="#FFE14D" stroke="#1A0B3D" stroke-width="3" stroke-linejoin="round"/></svg>
        <span style="font-weight:700;font-size:14px;letter-spacing:2px;color:#B3006A">BEST</span>
        <span id="bestScore" class="lil" style="font-size:30px;line-height:1">0</span>
      </div>
    </div>

    <!-- challenge-a-friend target (filled when opened from a share link) -->
    <div id="beatChip" class="abs center" style="top:466px;display:none">
      <div class="beat"><span>SCORE TO BEAT</span><b id="beatScore" class="lil">0</b><small id="beatWho"></small></div>
    </div>

    <div class="abs" style="left:50px;top:548px;width:290px;height:112px;animation:pulse 1.4s ease-in-out infinite">
      <button id="playBtn" class="btn play" aria-label="Play">
        <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 8 L40 24 L14 40 Z" fill="#fff" stroke="#1A0B3D" stroke-width="5" stroke-linejoin="round"/></svg>
        <span class="ol lil" style="font-size:60px;line-height:1;color:#fff;letter-spacing:2px">PLAY</span>
      </button>
    </div>

    <div class="abs center" style="top:698px">
      <button id="lbBtn" class="btn lbbtn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A0B3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>LEADERBOARD</button>
    </div>

    <div id="t-weedFront" class="layer"></div>
    <div class="abs center" style="top:790px;pointer-events:none">
      <div class="hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"/></svg>DRAG TO MOVE THE HOOK</div>
    </div>
  </section>

  <!-- ========== 2 · GAMEPLAY (canvas) ========== -->
  <section id="game" class="screen">
    <canvas id="cv" width="390" height="844"></canvas>
    <button id="pauseBtn" type="button" aria-label="Pause" class="round-btn" style="right:12px;top:78px;background:#FFE14D">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="1" width="5" height="16" rx="2" fill="#1A0B3D"/><rect x="11" y="1" width="5" height="16" rx="2" fill="#1A0B3D"/></svg>
    </button>
    <div id="clipToast" class="clip-toast" hidden></div>

    <!-- 3 · BOSS MOMENT overlay -->
    <div id="boss" class="overlay" hidden></div>

    <!-- pause -->
    <div id="pause" class="overlay dim" hidden>
      <div class="card" style="left:40px;top:250px;width:310px;padding:26px 20px 22px;gap:14px;align-items:center">
        <div class="ol lil" style="font-size:52px;color:#FFE14D;line-height:1">PAUSED</div>
        <button id="resumeBtn" class="btn big green" style="width:100%">RESUME</button>
        <div style="display:flex;gap:10px;width:100%">
          <button id="muteBtn" class="btn big cyan" style="flex:1;font-size:20px">SOUND ON</button>
          <button id="quitBtn" class="btn big pink" style="flex:1;font-size:20px;color:#fff">QUIT</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 4 · GAME OVER ========== -->
  <section id="over" class="screen" aria-label="Game over"></section>

  <!-- ========== 5 · LEADERBOARD ========== -->
  <section id="board" class="screen" aria-label="Leaderboard"></section>

  <div id="loading" class="overlay" style="background:#2B0A73;display:flex;align-items:center;justify-content:center"><div class="ol lil" style="font-size:40px;color:#FFE14D">LOADING…</div></div>
</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
